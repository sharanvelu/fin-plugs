# Shared toolchain setup used by every workflow: one place to change the
# Python version / install strategy so individual workflows can't drift.
#
# This repo has no pyproject of its own — plugs run under fincli, so the
# toolchain IS fincli: check out sharanvelu/fin and install it with its dev
# extra, which brings pytest/ruff/mypy at the tool repo's pinned versions.
# This repo must never pin its own copies of those tools.

name: Setup Python toolchain
description: Install Python with pip caching, then fincli (+ dev tools) from sharanvelu/fin.

inputs:
  python-version:
    description: Python version to install.
    required: false
    default: "3.11"

runs:
  using: composite
  steps:
    # The tool repo is public — a plain unauthenticated checkout works.
    - name: Check out fincli
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: sharanvelu/fin
        path: fin-cli
        persist-credentials: false

    - name: Install Python ${{ inputs.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: fin-cli/pyproject.toml

    - name: Install fincli (+ dev tools via the dev extra)
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install "./fin-cli[dev]"
