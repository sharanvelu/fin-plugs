name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      # Plugs run under fincli; the tests import it. The tool is public, so a
      # plain checkout works — no token needed.
      - name: Check out fincli
        uses: actions/checkout@v4
        with:
          repository: sharanvelu/fin
          path: fin-cli

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: fin-cli/pyproject.toml

      - name: Install fincli (+ pytest via the dev extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./fin-cli[dev]"

      - name: Run tests
        run: python -m pytest

  contract:
    # The repo-specific invariants (fincli/stdlib-only imports, the declarative
    # rule, loader discovery) as their own status check. These also run inside
    # the `test` job's suite; this job just makes a violation legible at a
    # glance on the PR.
    name: plug contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out fincli
        uses: actions/checkout@v4
        with:
          repository: sharanvelu/fin
          path: fin-cli

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fin-cli/pyproject.toml

      - name: Install fincli (+ pytest via the dev extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./fin-cli[dev]"

      - name: Check plug contracts
        run: python -m pytest tests/test_plug_contracts.py -v

  catalog-check:
    # PRs and non-master pushes: a change to plugs/ without a regenerated
    # catalog.json must fail — `fin plugs search` reads the catalog straight
    # from master by raw URL, so it can never be allowed to drift.
    name: catalog is current
    if: github.event_name != 'push' || github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out fincli
        uses: actions/checkout@v4
        with:
          repository: sharanvelu/fin
          path: fin-cli

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fin-cli/pyproject.toml

      - name: Install fincli
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./fin-cli

      - name: Check catalog.json matches plugs/
        run: python scripts/build_catalog.py --check

  catalog-release:
    # Push to master: regenerate catalog.json and publish it to GitHub
    # Releases — a new incremental patch version (1.1.2 → 1.1.3) plus the
    # rolling `latest` release, whose catalog.json asset is always replaced.
    # Only the catalog is distributed this way: plug files are always served
    # from the master branch raw URLs (the catalog's files_base_url).
    name: publish catalog release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check out fincli
        uses: actions/checkout@v4
        with:
          repository: sharanvelu/fin
          path: fin-cli

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fin-cli/pyproject.toml

      - name: Install fincli
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./fin-cli

      - name: Regenerate catalog.json
        run: python scripts/build_catalog.py

      - name: Publish catalog to releases (next version + latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Skip when the catalog hasn't changed since the last publish.
          if gh release download latest --pattern catalog.json --output /tmp/catalog-latest.json 2>/dev/null \
             && cmp -s catalog.json /tmp/catalog-latest.json; then
            echo "catalog.json unchanged since the last release — nothing to publish."
            exit 0
          fi

          # Previous version = newest X.Y.Z-tagged release; bump the patch.
          prev=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq '[.[].tag_name | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))] | first // empty')
          if [ -z "$prev" ]; then
            next="1.0.0"
          else
            IFS=. read -r major minor patch <<< "$prev"
            next="$major.$minor.$((patch + 1))"
          fi
          echo "Publishing catalog as $next (previous: ${prev:-none})."

          gh release create "$next" catalog.json \
            --title "$next" \
            --notes "Plug catalog generated from master (${GITHUB_SHA}). Plug files are served from the master branch."

          # The rolling `latest` release: same catalog, asset always replaced.
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest catalog.json --clobber
          else
            gh release create latest catalog.json --latest=false \
              --title "latest" \
              --notes "Always the current plug catalog; the asset is replaced on every publish. Plug files are served from the master branch."
          fi

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/ruff-action@v3
        with:
          args: check plugs scripts tests
