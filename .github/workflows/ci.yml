name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      # Plugs run under fincli; the tests import it. The tool is public, so a
      # plain checkout works — no token needed.
      - name: Check out fincli
        uses: actions/checkout@v4
        with:
          repository: sharanvelu/fin
          path: fin-cli

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: fin-cli/pyproject.toml

      - name: Install fincli (+ pytest via the dev extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./fin-cli[dev]"

      - name: Run tests
        run: python -m pytest

  contract:
    # The repo-specific invariants (fincli/stdlib-only imports, the declarative
    # rule, loader discovery) as their own status check. These also run inside
    # the `test` job's suite; this job just makes a violation legible at a
    # glance on the PR.
    name: plug contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out fincli
        uses: actions/checkout@v4
        with:
          repository: sharanvelu/fin
          path: fin-cli

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fin-cli/pyproject.toml

      - name: Install fincli (+ pytest via the dev extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./fin-cli[dev]"

      - name: Check plug contracts
        run: python -m pytest tests/test_plug_contracts.py -v

  catalog-check:
    # PRs and non-master pushes: a change to plugs/ without a regenerated
    # catalog.json must fail — `fin plugs search` reads the catalog straight
    # from master by raw URL, so it can never be allowed to drift.
    name: catalog is current
    if: github.event_name != 'push' || github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out fincli
        uses: actions/checkout@v4
        with:
          repository: sharanvelu/fin
          path: fin-cli

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fin-cli/pyproject.toml

      - name: Install fincli
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./fin-cli

      - name: Check catalog.json matches plugs/
        run: python scripts/build_catalog.py --check

  catalog-commit:
    # Push to master: regenerate catalog.json and commit it back if it
    # changed. The `[skip ci]` in the commit message stops the pushed commit
    # from re-triggering this workflow (GitHub honours it natively).
    name: regenerate catalog on master
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check out fincli
        uses: actions/checkout@v4
        with:
          repository: sharanvelu/fin
          path: fin-cli

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fin-cli/pyproject.toml

      - name: Install fincli
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./fin-cli

      - name: Regenerate catalog.json
        run: python scripts/build_catalog.py

      - name: Commit catalog.json if it changed
        run: |
          if git diff --quiet -- catalog.json; then
            echo "catalog.json unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "Regenerate catalog.json [skip ci]"
          git push

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/ruff-action@v3
        with:
          args: check plugs scripts tests
