# Formatting + lint for every PR — CHECK-ONLY: CI never rewrites code.
# Developers fix locally with `ruff format` / `ruff check --fix`.
#
# ruff comes from fincli's dev extra (via the setup action), pinned in the
# tool repo's pyproject — this repo installs no ruff of its own, so the two
# repos can never disagree on the tool version. Rule selection lives in
# ruff.toml here (pinned explicitly; never rely on ruff's floating defaults).
#
# Required status check: "Code Style Gate" (only the gate — the style job is
# path-filtered and may legitimately be skipped).

name: code style

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: code-style-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            python:
              - 'plugs/**'
              - 'tests/**'
              - 'scripts/**'
              - 'ruff.toml'
              - '.github/workflows/code-style.yml'
              - '.github/actions/setup/**'

  style:
    name: ruff (lint + format check)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: ruff check
        run: python -m ruff check --output-format=github plugs scripts tests

      - name: ruff format --check
        run: python -m ruff format --check plugs scripts tests

  gate:
    name: Code Style Gate
    needs: [changes, style]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any needed job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: All good
        run: echo "All jobs succeeded or were skipped as not relevant."
