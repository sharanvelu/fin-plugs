# Publish the plug catalog on every push to master: regenerate catalog.json
# and, when its content changed, publish it twice —
#   1. a NEW incremental patch release (previous 1.1.2 → this build 1.1.3,
#      starting at 1.0.0 when no X.Y.Z release exists yet), pinned forever;
#   2. the rolling `latest` release, whose catalog.json asset is replaced.
#
# The numbered releases are what GitHub's native
# `releases/latest/download/catalog.json` URL (the one the fin CLI fetches)
# resolves to — keep them NON-prerelease and NON-draft, or that redirect
# skips them. If GitHub's "immutable releases" setting is ever enabled on
# this repo, the rolling `latest` release's `--clobber` upload will start
# failing: simply delete the rolling release — the numbered releases already
# serve the CLI. (The fin repo was bitten by exactly this.)
#
# Plug files themselves are always served from the master branch raw URLs
# (the catalog's files_base_url); releases only distribute the catalog.

name: catalog release

on:
  push:
    branches: [master]

permissions: {}

# Never cancel an in-flight publish — a half-published release is worse than
# a briefly-stale one. Queue instead.
concurrency:
  group: catalog-release
  cancel-in-progress: false

jobs:
  release:
    name: publish catalog release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create releases + upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Regenerate catalog.json
        run: python scripts/build_catalog.py

      - name: Publish catalog to releases (next version + latest)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          # Skip when the catalog hasn't changed since the last publish.
          if gh release download latest --pattern catalog.json --output /tmp/catalog-latest.json 2>/dev/null \
             && cmp -s catalog.json /tmp/catalog-latest.json; then
            echo "catalog.json unchanged since the last release — nothing to publish."
            exit 0
          fi

          # Previous version = newest X.Y.Z-tagged release; bump the patch.
          prev=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq '[.[].tag_name | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))] | first // empty')
          if [ -z "$prev" ]; then
            next="1.0.0"
          else
            IFS=. read -r major minor patch <<< "$prev"
            next="$major.$minor.$((patch + 1))"
          fi
          echo "Publishing catalog as $next (previous: ${prev:-none})."

          gh release create "$next" catalog.json \
            --title "$next" \
            --notes "Plug catalog generated from master (${SHA}). Plug files are served from the master branch."

          # The rolling `latest` release: same catalog, asset always replaced.
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest catalog.json --clobber
          else
            gh release create latest catalog.json --latest=false \
              --title "latest" \
              --notes "Always the current plug catalog; the asset is replaced on every publish. Plug files are served from the master branch."
          fi
