# Block PRs that introduce dependencies with known vulnerabilities (moderate+).
# The only manifest ecosystem in this repo is github-actions (plugs have no
# Python dependencies of their own).
#
# Required status check: "Dependency Review". Deliberately NOT path-filtered:
# the action no-ops fast when no manifests changed, and keeping it
# unconditional means no gate job is needed. Requires the repository's
# dependency graph to be enabled (Settings → Advanced Security).

name: dependency review

on:
  pull_request:
    branches: [master]

permissions: {}

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # comment-summary-in-pr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
